/* --- テーマ変数定義 --- */
:root {
    /* DEFAULT: CYBER NEON */
    --bg-gradient: linear-gradient(180deg, #000000, #020617);
    --bg-radial: radial-gradient(circle at 20% 20%, #0ea5e922 0%, transparent 25%), radial-gradient(circle at 80% 30%, #9333ea22 0%, transparent 25%), radial-gradient(circle at 50% 80%, #06b6d422 0%, transparent 25%);
    --main-border: #00ffff;
    --main-glow: 0 0 5px #00ffff, 0 0 20px rgba(0,255,255,0.25);
    --panel-bg: linear-gradient(180deg, #111827, #030712);
    --panel-border: #00ffff;
    --panel-glow: 0 0 10px rgba(0,255,255,0.2);
    --title-color: #00ffff;
    --label-color: #854dff;
    --info-color: #ffffff;
    --canvas-bg: #050505;
    --grid-color: #ffffff11;
}

[data-theme="retro"] {
    /* RETRO GB (ゲームボーイ風) */
    --bg-gradient: linear-gradient(180deg, #8b956d, #7c875e);
    --bg-radial: none;
    --main-border: #0f380f;
    --main-glow: none;
    --panel-bg: #9bbc0f;
    --panel-border: #0f380f;
    --panel-glow: none;
    --title-color: #0f380f;
    --label-color: #306230;
    --info-color: #0f380f;
    --canvas-bg: #9bbc0f;
    --grid-color: #0f380f22;
}

[data-theme="mono"] {
    /* MONO MATRIX (白黒ミニマル) */
    --bg-gradient: linear-gradient(180deg, #1c1c1c, #0a0a0a);
    --bg-radial: none;
    --main-border: #ffffff;
    --main-glow: 0 0 10px rgba(255,255,255,0.3);
    --panel-bg: #121212;
    --panel-border: #444444;
    --panel-glow: none;
    --title-color: #ffffff;
    --label-color: #888888;
    --info-color: #ffffff;
    --canvas-bg: #000000;
    --grid-color: #ffffff0a;
}

margin:0;
padding:0;
