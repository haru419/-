<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEON TETRIS</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#020617;
    font-family:sans-serif;
    overflow:hidden;
    color:white;
}

.wrapper{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:10px;
}

.title{
    font-size:42px;
    font-weight:bold;
    color:#00ffff;
    margin-bottom:15px;
    text-shadow:
    0 0 10px #00ffff,
    0 0 20px #00ffff,
    0 0 40px #00ffff;
}

.game-area{
    display:flex;
    gap:15px;
    align-items:flex-start;
}

canvas{
    background:#050816;
    border:3px solid #00ffff;
    border-radius:12px;
    box-shadow:
    0 0 10px #00ffff,
    0 0 30px rgba(0,255,255,0.5);
}

.side{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.panel{
    width:140px;
    background:#0f172a;
    border:2px solid #00ffff;
    border-radius:12px;
    padding:10px;
    box-shadow:0 0 15px rgba(0,255,255,0.3);
}

.panel-title{
    color:#00ffff;
    margin-bottom:8px;
    font-weight:bold;
}

.info{
    font-size:20px;
}

.mobile-controls{
    margin-top:15px;
    display:none;
}

.row{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:10px;
}

.btn{
    width:70px;
    height:70px;
    border:none;
    border-radius:15px;
    background:#111827;
    color:#00ffff;
    font-size:26px;
    border:2px solid #00ffff;
    box-shadow:
    0 0 10px #00ffff;
}

.btn:active{
    transform:scale(0.95);
}

.big{
    width:150px;
}

@media(max-width:900px){

    .game-area{
        flex-direction:column;
        align-items:center;
    }

    .mobile-controls{
        display:block;
    }

}

</style>
</head>
<body>

<div class="wrapper">

<div class="title">NEON TETRIS</div>

<div class="game-area">

<canvas id="game" width="300" height="600"></canvas>

<div class="side">

<div class="panel">
<div class="panel-title">SCORE</div>
<div class="info" id="score">0</div>
</div>

<div class="panel">
<div class="panel-title">LEVEL</div>
<div class="info" id="level">1</div>
</div>

<div class="panel">
<div class="panel-title">LINES</div>
<div class="info" id="lines">0</div>
</div>

<div class="panel">
<div class="panel-title">NEXT</div>
<canvas id="next" width="120" height="120"></canvas>
</div>

<div class="panel">
<div class="panel-title">HOLD</div>
<canvas id="hold" width="120" height="120"></canvas>
</div>

</div>
</div>

<div class="mobile-controls">

<div class="row">
<button class="btn big" id="rotate">↻</button>
<button class="btn big" id="harddrop">⤓</button>
</div>

<div class="row">
<button class="btn" id="left">←</button>
<button class="btn" id="down">↓</button>
<button class="btn" id="right">→</button>
</div>

<div class="row">
<button class="btn big" id="holdBtn">HOLD</button>
</div>

</div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const nextCanvas = document.getElementById("next");
const nextCtx = nextCanvas.getContext("2d");

const holdCanvas = document.getElementById("hold");
const holdCtx = holdCanvas.getContext("2d");

ctx.scale(30,30);
nextCtx.scale(30,30);
holdCtx.scale(30,30);

const colors = [
null,
"#00ffff",
"#0066ff",
"#ff8800",
"#ffff00",
"#00ff66",
"#bb00ff",
"#ff0033"
];

function createMatrix(w,h){
    const matrix=[];
    while(h--){
        matrix.push(new Array(w).fill(0));
    }
    return matrix;
}

function createPiece(type){

if(type==="T"){
return [
[0,6,0],
[6,6,6],
[0,0,0]
];
}

if(type==="O"){
return [
[4,4],
[4,4]
];
}

if(type==="L"){
return [
[0,3,0],
[0,3,0],
[0,3,3]
];
}

if(type==="J"){
return [
[0,2,0],
[0,2,0],
[2,2,0]
];
}

if(type==="I"){
return [
[0,1,0,0],
[0,1,0,0],
[0,1,0,0],
[0,1,0,0]
];
}

if(type==="S"){
return [
[0,5,5],
[5,5,0],
[0,0,0]
];
}

if(type==="Z"){
return [
[7,7,0],
[0,7,7],
[0,0,0]
];
}

}

function randomPiece(){
const pieces="TJLOSZI";
return createPiece(
pieces[Math.floor(Math.random()*pieces.length)]
);
}

const arena=createMatrix(10,20);

const player={
pos:{x:0,y:0},
matrix:null,
score:0,
lines:0,
level:1
};

let nextPiece=randomPiece();
let holdPiece=null;
let canHold=true;

function collide(arena,player){

const [m,o]=[player.matrix,player.pos];

for(let y=0;y<m.length;y++){
for(let x=0;x<m[y].length;x++){

if(
m[y][x]!==0 &&
(arena[y+o.y] &&
arena[y+o.y][x+o.x])!==0
){
return true;
}

}
}

return false;
}

function merge(arena,player){

player.matrix.forEach((row,y)=>{
row.forEach((value,x)=>{

if(value!==0){
arena[y+player.pos.y][x+player.pos.x]=value;
}

});
});

}

function arenaSweep(){

let cleared=0;

outer:
for(let y=arena.length-1;y>0;--y){

for(let x=0;x<arena[y].length;++x){

if(arena[y][x]===0){
continue outer;
}

}

arena.splice(y,1);

arena.unshift(new Array(10).fill(0));

y++;

cleared++;

}

if(cleared>0){

player.lines += cleared;

player.score += cleared*100*player.level;

player.level=Math.floor(player.lines/10)+1;

dropInterval=Math.max(
100,
700-(player.level-1)*50
);

updateUI();

}

}

function playerReset(){

player.matrix=nextPiece;

nextPiece=randomPiece();

drawNext();

player.pos.y=0;

player.pos.x=
(10/2|0)-
(player.matrix[0].length/2|0);

canHold=true;

if(collide(arena,player)){

alert("GAME OVER");

arena.forEach(row=>row.fill(0));

player.score=0;
player.lines=0;
player.level=1;

updateUI();

}

}

function playerMove(dir){

player.pos.x += dir;

if(collide(arena,player)){
player.pos.x -= dir;
}

}

function playerDrop(){

player.pos.y++;

if(collide(arena,player)){

player.pos.y--;

merge(arena,player);

arenaSweep();

playerReset();

}

dropCounter=0;

}

function hardDrop(){

while(!collide(arena,player)){
player.pos.y++;
}

player.pos.y--;

merge(arena,player);

arenaSweep();

playerReset();

dropCounter=0;

}

function rotate(matrix){

for(let y=0;y<matrix.length;++y){

for(let x=0;x<y;++x){

[
matrix[x][y],
matrix[y][x]

]=[

matrix[y][x],
matrix[x][y]

];

}

}

matrix.forEach(row=>row.reverse());

}

function playerRotate(){

rotate(player.matrix);

if(collide(arena,player)){

rotate(player.matrix);
rotate(player.matrix);
rotate(player.matrix);

}

}

function hold(){

if(!canHold) return;

if(holdPiece===null){

holdPiece=player.matrix;

playerReset();

}else{

const temp=holdPiece;

holdPiece=player.matrix;

player.matrix=temp;

player.pos.y=0;
player.pos.x=3;

}

drawHold();

canHold=false;

}

function drawBlock(x,y,color,alpha=1){

ctx.globalAlpha=alpha;

ctx.fillStyle=color;

ctx.shadowColor=color;
ctx.shadowBlur=15;

ctx.fillRect(x,y,1,1);

ctx.strokeStyle="#ffffff55";

ctx.strokeRect(x,y,1,1);

ctx.shadowBlur=0;

ctx.globalAlpha=1;

}

function drawMatrix(matrix,offset,alpha=1){

matrix.forEach((row,y)=>{

row.forEach((value,x)=>{

if(value!==0){

drawBlock(
x+offset.x,
y+offset.y,
colors[value],
alpha
);

}

});

});

}

function drawGhost(){

const ghost={
pos:{
x:player.pos.x,
y:player.pos.y
},
matrix:player.matrix
};

while(!collide(arena,ghost)){
ghost.pos.y++;
}

ghost.pos.y--;

drawMatrix(
ghost.matrix,
ghost.pos,
0.2
);

}

function draw(){

ctx.fillStyle="#050816";

ctx.fillRect(0,0,canvas.width,canvas.height);

drawMatrix(arena,{x:0,y:0});

drawGhost();

drawMatrix(player.matrix,player.pos);

}

function drawMini(ctx2,matrix){

ctx2.clearRect(0,0,120,120);

if(!matrix) return;

matrix.forEach((row,y)=>{

row.forEach((value,x)=>{

if(value!==0){

ctx2.fillStyle=colors[value];

ctx2.fillRect(x+0.5,y+0.5,1,1);

}

});

});

}

function drawNext(){
drawMini(nextCtx,nextPiece);
}

function drawHold(){
drawMini(holdCtx,holdPiece);
}

function updateUI(){

document.getElementById("score").innerText=
player.score;

document.getElementById("level").innerText=
player.level;

document.getElementById("lines").innerText=
player.lines;

}

let dropCounter=0;
let dropInterval=700;
let lastTime=0;

function update(time=0){

const deltaTime=time-lastTime;

lastTime=time;

dropCounter += deltaTime;

if(dropCounter > dropInterval){
playerDrop();
}

draw();

requestAnimationFrame(update);

}

document.addEventListener("keydown",event=>{

if(event.key==="ArrowLeft"){
playerMove(-1);
}

else if(event.key==="ArrowRight"){
playerMove(1);
}

else if(event.key==="ArrowDown"){
playerDrop();
}

else if(event.key==="ArrowUp"){
playerRotate();
}

else if(event.code==="Space"){
hardDrop();
}

else if(event.key==="c" || event.key==="C"){
hold();
}

});

document.getElementById("left").onclick=()=>{
playerMove(-1);
};

document.getElementById("right").onclick=()=>{
playerMove(1);
};

document.getElementById("down").onclick=()=>{
playerDrop();
};

document.getElementById("rotate").onclick=()=>{
playerRotate();
};

document.getElementById("harddrop").onclick=()=>{
hardDrop();
};

document.getElementById("holdBtn").onclick=()=>{
hold();
};

playerReset();

updateUI();

update();

</script>

</body>
</html>
